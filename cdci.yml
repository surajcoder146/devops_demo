name: CI-CD Pipeline

on:
  push:
    branches:
      -main

permissions:
  contents: read
  pages: write
  id-token: write

  jobs:
  
  build:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v6
  
    - name: Build website
      run: |
        mkdir build 
        cp index.html build/
        cp style.css build/


    - name: Upload build
      uses: action/upload-artifact@v4
      with:
        name: website-build
        path: build/

test:
  runs-on: ubuntu-latest
  needs: build

  steps:
   name: dowload build
   users: action/dowload-artifact@v4
   with:
   name: website-build
   path: build

   name: test website
   run: 
    test -f buils/index.html
    test -f build/style.css

   name: upload pages artifact
   users: actions/upload-pages-artifact@v4
   with:
   path: './build


   deploy:
   run-on: ubuntu-latest
   needs: test

   envirinment:
   name: github-pages
   url: ${{ steps.deployment.output.pages_url }}

   steps:
   name: deploy to  Github pages
   id: deployment
   uses: actions/deploy-pages-pages@v4